<svg width="980" height="560" viewBox="0 0 980 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Trend of multi-agent share in LLM4Science and AI4Science from 2024 to 2026 YTD</title>
  <desc id="desc">A line chart showing rising multi-agent share for LLM4Science and AI4Science. LLM4Science rises from 7.51 percent in 2024 to 15.22 percent in 2025 and 21.40 percent in 2026 year to date. AI4Science rises from 5.68 percent in 2024 to 9.78 percent in 2025 and 14.92 percent in 2026 year to date.</desc>
