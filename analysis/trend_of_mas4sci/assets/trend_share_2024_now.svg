  <polyline points="160,323.9 500,225.2 840,146.1" fill="none" stroke="#7E9B78" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="160,347.3 500,294.8 840,229.0" fill="none" stroke="#6F8F8C" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

